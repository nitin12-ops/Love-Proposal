<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love </title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff758c,#ff7eb3,#fad0c4);
    overflow:hidden;
}

.card{
    width:420px;
    padding:35px;
    text-align:center;
    background:rgba(255,255,255,0.2);
    backdrop-filter:blur(10px);
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,.3);
}

h1{
    color:white;
    margin-bottom:20px;
}

p{
    color:white;
    margin-bottom:25px;
    font-size:18px;
}

#buttons{
    position:relative;
    width:100%;
    height:150px;
}

button{
    padding:12px 35px;
    border:none;
    border-radius:30px;
    font-size:20px;
    cursor:pointer;
    font-weight:bold;
}

#yes{
    position:absolute;
    left:40px;
    top:40px;
    background:#ff3b3b;
    color:white;
}

#no{
    position:absolute;
    right:40px;
    top:40px;
    background:#00b894;
    color:white;
}

#result{
    display:none;
}

#result img{
    width:260px;
    border-radius:15px;
    margin-top:20px;
}

#result h2{
    color:white;
    margin-top:15px;
}
</style>

</head>
<body>

<div class="card">

<div id="question">
<h1>😎 Am I a Bad Boy?</h1>
<p>Choose the correct answers 😊</p>

<div id="buttons">
<button id="yes">Yes</button>
<button id="no">No</button>
</div>
</div>

<div id="result">
<h2>❤️ Thank You ❤️</h2>

<img src="https://static.vecteezy.com/system/resources/thumbnails/038/126/758/small_2x/ai-generated-a-loving-couple-holding-a-glittering-red-heart-close-surrounded-by-a-romantic-bokeh-light-effect-celebrating-valentine-s-day-free-photo.jpeg" alt="Love">

<p style="margin-top:15px;">You are Awesome! 💖</p>
</div>

</div>

<script>

const yes = document.getElementById("yes");
const no = document.getElementById("no");
const result = document.getElementById("result");
const question = document.getElementById("question");
const buttons = document.getElementById("buttons");

// YES button moves only inside the card
yes.addEventListener("mouseenter",function(){

    let maxX = buttons.clientWidth - yes.offsetWidth;
    let maxY = buttons.clientHeight - yes.offsetHeight;

    let x = Math.random() * maxX;
    let y = Math.random() * maxY;

    yes.style.left = x + "px";
    yes.style.top = y + "px";

});

// NO button click
no.addEventListener("click",function(){

    question.style.display="none";
    result.style.display="block";

});

</script>

</body>
</html>
